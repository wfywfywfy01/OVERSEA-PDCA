<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERTU 国家合伙人简历打分 · 试跑 v2.0</title>
<style>
body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1f2328;background:#f6f7f9}
h1{font-size:20px;margin:8px 0}
.sub{color:#667085;font-size:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:16px;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.row label{color:#475467}
input,select{padding:5px 8px;border:1px solid #c9cdd3;border-radius:6px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #e3e6ea;padding:8px 6px;text-align:left;vertical-align:top}
.dim-desc{color:#667085;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.ok{background:#e7f6ec;color:#0f7b3d}
.no{background:#fdeceb;color:#b42318}
.warn{background:#fef4e6;color:#9a5b00}
.redline{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:6px 0}
.stat b{font-size:16px}
pre{background:#f2f4f7;padding:12px;border-radius:8px;font-size:12px;overflow:auto;white-space:pre-wrap}
button{background:#1f2328;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<h1>VERTU 全球国家合伙人简历打分 · 试跑 v2.0</h1>
<div class="sub">五维各 0–2 分共 10 分；≥5 且无红线 = 通过初筛；得分≥1 的维度证据为 N 自动降 1 分并标「待核实」</div>

<div class="card">
<div class="row">
<label>候选人 <input id="f_name" size="12"></label>
<label>目标国家 <input id="f_country" size="12"></label>
<label>简历来源 <input id="f_source" size="14"></label>
<label>打分人 <input id="f_scorer" size="10"></label>
<label>日期 <input id="f_date" type="date"></label>
</div>
</div>

<div class="card">
<table>
<thead><tr><th style="width:26%">维度</th><th style="width:12%">得分</th><th style="width:12%">证据 V/S/N</th><th>证据摘录（原文）</th></tr></thead>
<tbody id="dims"></tbody>
</table>
<div class="stat" style="margin-top:10px">总分 <b id="st_total">0</b>/10 · 核心分(1+3) <b id="st_core">0</b> · V 证据数 <b id="st_v">0</b></div>
</div>

<div class="card">
<div style="font-weight:600;margin-bottom:8px">一票否决红线（触发任意一条直接不予准入）</div>
<div id="redlines"></div>
</div>

<div class="card">
<div style="font-weight:600;margin-bottom:8px">准入结论</div>
<div id="conclusion">—</div>
<div style="margin-top:10px"><button onclick="exportJson()">导出 JSON（复制到剪贴板）</button></div>
<pre id="out" style="display:none"></pre>
</div>
<script>
const DIMS = [
 ["1. 海外本地资源网络","2分:居住/深耕≥3年且≥3条可核验本地资源(政商华人圈/商会侨团/供应链/HNWI)；1分:1–3年有基础人脉；0分:无驻留无人脉"],
 ["2. 行业与客群对口经验","2分:奢侈品/名表珠宝/豪车或3C大厂出海区域负责人；1分:传统3C外贸/跨境电商/高端服务业；0分:无相关"],
 ["3. 渠道开拓与商务谈判","2分:千万级渠道盘+签约经销商/进驻高端商场/大宗政商采购战绩(客户+金额+时间)；1分:百万级大单；0分:仅执行"],
 ["4. 跨文化与语言能力","2分:目标国官方语言流利可独立谈判(或英语流利+本地背书)；1分:工作英语书面可沟通需翻译；0分:无法独立交流"],
 ["5. 创业自驱与狼性自驱","2分:真实创业/合伙人经历或接受低底薪高分成试跑；1分:进取心强但要求保底；0分:打工心态"]
];
const REDS = ["简历造假/诚信问题","与 VERTU 渠道冲突或竞业限制","目标国无合法居留/工作/经营资格","政治敏感/制裁名单/负面舆情","欠款纠纷/资金风险/重大违约"];
const tb = document.getElementById("dims");
DIMS.forEach((d, i) => {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td><b>' + d[0] + '</b><div class="dim-desc">' + d[1] + '</div></td>'
    + '<td><select id="s' + i + '"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></td>'
    + '<td><select id="e' + i + '"><option value="N">N</option><option value="S">S</option><option value="V">V</option></select></td>'
    + '<td><input id="q' + i + '" size="34" placeholder="证据摘录" oninput="calc()"></td>';
  tb.appendChild(tr);
  tr.querySelectorAll("select").forEach(s => s.onchange = calc);
});
const rl = document.getElementById("redlines");
REDS.forEach((r, i) => {
  const d = document.createElement("div"); d.className = "redline";
  d.innerHTML = '<input type="checkbox" id="r' + i + '" onchange="calc()"> <label for="r' + i + '">' + r + '</label>';
  rl.appendChild(d);
});
function calc() {
  let total = 0, core = 0, v = 0; const notes = [];
  DIMS.forEach((d, i) => {
    let s = +document.getElementById("s" + i).value;
    const e = document.getElementById("e" + i).value;
    if (e === "V") v++;
    if (s >= 1 && e === "N") { s--; notes.push(d[0] + " 证据为 N，降 1 分"); }
    total += s; if (i === 0 || i === 2) core += s;
  });
  document.getElementById("st_total").textContent = total;
  document.getElementById("st_core").textContent = core;
  document.getElementById("st_v").textContent = v;
  const red = REDS.some((r, i) => document.getElementById("r" + i).checked);
  const c = document.getElementById("conclusion");
  if (red) {
    c.innerHTML = '<span class="badge no">不予准入（触发一票否决红线）</span><div style="margin-top:6px;font-size:13px">进入储备人才库，不发放试跑工具包。</div>';
  } else if (total >= 5) {
    c.innerHTML = '<span class="badge ok">通过初筛（' + total + ' 分）</span><div style="margin-top:6px;font-size:13px">发放试跑工具包 + 签署《海外储备顾问协议》+ 启动首单攻坚。同分排序：核心分 ' + core + ' → V 证据数 ' + v + ' → 维度5。</div>';
  } else {
    c.innerHTML = '<span class="badge warn">不予准入（' + total + ' 分 &lt; 5）</span><div style="margin-top:6px;font-size:13px">进入储备人才库持续培育。</div>';
  }
  if (notes.length) c.innerHTML += '<div style="margin-top:6px;font-size:12px;color:#9a5b00">⚠ ' + notes.join("；") + '</div>';
}
function exportJson() {
  const rows = DIMS.map((d, i) => ({ dim: d[0], score: +document.getElementById("s" + i).value, evidence: document.getElementById("e" + i).value, quote: document.getElementById("q" + i).value }));
  const reds = REDS.map((r, i) => ({ item: r, hit: document.getElementById("r" + i).checked }));
  const obj = { model: "VERTU 国家合伙人简历打分 v2.0 试跑", candidate: document.getElementById("f_name").value, country: document.getElementById("f_country").value, source: document.getElementById("f_source").value, scorer: document.getElementById("f_scorer").value, date: document.getElementById("f_date").value, dims: rows, redlines: reds, total: document.getElementById("st_total").textContent, core: document.getElementById("st_core").textContent, v_evidence: document.getElementById("st_v").textContent, conclusion: document.getElementById("conclusion").innerText };
  const s = JSON.stringify(obj, null, 2);
  const pre = document.getElementById("out"); pre.style.display = "block"; pre.textContent = s;
  navigator.clipboard && navigator.clipboard.writeText(s);
}
calc();
</script>
</body>
</html>
